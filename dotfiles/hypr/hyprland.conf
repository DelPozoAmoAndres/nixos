

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
source = ~/.config/hypr/colors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1, 1920x1080@164, 300x1080, 1, vrr, 1
monitor=HDMI-A-1, 2560x1080@60, 0x0, 1,


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = sh ~/.config/hypr/ipc-compat.sh
exec-once = hyprpaper
exec-once = hyprpolkitagent
exec-once = hyprpanel
exec-once = ulauncher --hide-window --no-window-shadow

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = XCURSOR_THEME,Adwaita

# Forzar VirtualBox a usar X11 (xcb) en lugar de Wayland para evitar pantalla negra en fullscreen
env = QT_QPA_PLATFORM,xcb

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 0
    gaps_out = 0
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border=$lavender
    col.inactive_border=$surface2

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 3

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0 

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$seccMod = ALT_R

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, ulauncher-toggle
bind = $seccMod, B, exec, brave
bind = $seccMod, D, exec, vesktop
bind = $seccMod, S, exec, steam
bind = $seccMod, F, exec, $fileManager
bind = $seccMod, T, exec, $terminal
bind = $mainMod, M, exec, pear-desktop
bind = $mainMod, L, exec, hyprshot -m region --clipboard-only
bind = $seccMod, W, killactive
bind = $seccMod, A, exec, hyprpanel toggleWindow settings-dialog

#bind = $mainMod, L, exit
bind = $seccMod, V, togglefloating
bind = $mainMod, P, pseudo, # dwinkle
bind = $mainMod, J, layoutmsg, rotatesplit


# Move focus with mainMod + arrow keys
bind = $seccMod, left, movefocus, l
bind = $seccMod, right, movefocus, r
bind = $seccMod, up, movefocus, u
bind = $seccMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $seccMod SHIFT, 1, workspace, 1
bind = $seccMod SHIFT, 2, workspace, 2
bind = $seccMod SHIFT, 3, workspace, 3
bind = $seccMod SHIFT, 4, workspace, 4
bind = $seccMod SHIFT, 5, workspace, 5
bind = $seccMod SHIFT, 6, workspace, 6
bind = $seccMod SHIFT, 7, workspace, 7
bind = $seccMod SHIFT, 8, workspace, 8
bind = $seccMod SHIFT, 9, workspace, 9
bind = $seccMod SHIFT, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $seccMod, 1, movetoworkspace, 1
bind = $seccMod, 2, movetoworkspace, 2
bind = $seccMod, 3, movetoworkspace, 3
bind = $seccMod, 4, movetoworkspace, 4
bind = $seccMod, 5, movetoworkspace, 5
bind = $seccMod, 6, movetoworkspace, 6
bind = $seccMod, 7, movetoworkspace, 7
bind = $seccMod, 8, movetoworkspace, 8
bind = $seccMod, 9, movetoworkspace, 9
bind = $seccMod, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
#bindm = $mainMod, mouse:272, movewindow
#bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrule = float,class:^(kitty)$,title:^(kitty)$

windowrule = match:class ^.*$, suppress_event maximize # You'll probably like this.

# VirtualBox - forzar X11 (xcb) para evitar pantalla negra en fullscreen
windowrule = match:class ^(virtualbox|VirtualBox)$, opacity 1.0

# CS2 - forzar workspace 2 y habilitar tearing
windowrule = match:class ^(cs2)$, workspace 2

windowrule = match:class ^(ulauncher)$, border_size 0
windowrule = match:class ^(ulauncher)$, no_shadow true
windowrule = match:class ^(ulauncher)$, animation none

# Float and keep Picture-in-Picture on top of other windows
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 640 360

# Mover ventanas flotantes manteniendo Súper (tecla Windows) + Click Izquierdo
bindm = SUPER, mouse:272, movewindow

# Cambiar tamaño manteniendo Súper + Click Derecho
bindm = SUPER, mouse:273, resizewindow

