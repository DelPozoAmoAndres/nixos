########################################################################
# Wayle — sustituto de HyprPanel (archivado en nixpkgs).
#
# Replica el layout de la config.json de HyprPanel:
#   left   : power, separator, window-title
#   center : workspaces
#   right  : cpu, ram, volume, network, bluetooth, notifications, clock
#
# Mejoras sobre HyprPanel:
#   - CPU y RAM son modulos NATIVOS (no placeholders): incluyen
#     temperatura, frecuencia y thresholds de color por carga.
#   - Wayle esta escrito en Rust con GTK4: consume mucha menos RAM que
#     HyprPanel (que es GTK/JS con un motor web entero por debajo).
#   - Wayle tiene un modulo "custom" que ejecuta un comando de shell, lo
#     que permite meter el CPU por nucleo (ver custom-cpu-cores).
########################################################################

# ─── Barra ─────────────────────────────────────────────────────────────
[bar]
location = "top"

# Barra mas baja que la de HyprPanel: 45px frente a los ~53px del
# default (padding = 0.35).
#
# El padding tiene un minimo util: por debajo de ~0.14 la barra queda
# mas baja que el alto que necesitan los iconos y GTK4 vuelve a
# deformarlos (el sintoma es el mismo de antes: iconos estirados en
# vertical). Con los iconos de las apps en los workspaces, que ocupan
# mas alto, el minimo esta algo mas arriba que sin ellos.
#
# IMPORTANTE - por que los sizes van a 1.0:
#
# Wayle escala la fila de botones como un todo cuando button-label-size
# (o button-icon-size) lleva un valor FRACCIONARIO. GTK4 no re-renderiza
# los SVG: reescala el pixmap ya rasterizado, y un pixmap estirado en
# vertical deja los iconos deformados (el altavoz parece una flecha y
# el bluetooth una raya).
#
# Se perdio tiempo buscando la causa en el SVG (los iconos de Lucide
# vienen sin viewBox, que tambien deforman) y en el button-variant,
# pero el culpable era el label-size fraccionario: con
# button-label-size = 1.0 los iconos se ven perfectos a cualquier
# altura de barra.
#
# Conclusion: la barra se achica con "padding" (que solo cambia el
# grosor), nunca comprimiendo los iconos o el texto.
scale = 1.0
padding = 0.14
padding-ends = 0.4
module-gap = 0.4
exclusive = true
layer = "top"

# Transparente: en HyprPanel era "theme.bar.transparent = true", con el
# fondo de la barra a rgba(0,0,0,0). Aqui background-opacity = 0 deja
# la barra sin fondo, dejando ver el wallpaper.
background-opacity = 0
rounding = "none"
shadow = "none"

# Botones: sin bordes, sin fondo, texto plano. Es el estilo plano que
# tenia HyprPanel (todo con rgba(0,0,0,0) de fondo).
#
button-variant = "block-prefix"
button-opacity = 100
button-bg-opacity = 0

# Todos los sizes a 1.0 (ver la nota de arriba): bajar cualquiera de
# ellos deforma los iconos. 1.0 son 16px, el tamaño natural del SVG
# symbolic.
button-icon-size = 1.0
button-icon-padding = 1.0
button-label-size = 1.0
button-label-padding = 1.0
button-rounding = "none"
button-gap = 0.4
button-icon-position = "start"
button-border-location = "none"
button-border-width = 0

[bar.colors]
# Fondo totalmente transparente.
bg = "#00000000"

# ─── Layout ────────────────────────────────────────────────────────────
[[bar.layout]]
monitor = "*"
left = [ "power", "separator", "window-title" ]
center = [ "hyprland-workspaces" ]
right = [
    "cpu",
    "ram",
    "volume",
    "network",
    "bluetooth",
    "notifications",
    "clock",
]

# ─── Tema ──────────────────────────────────────────────────────────────
# La paleta NO se define aqui: el modulo wayle/hm.nix de nixpkgs la
# conecta con stylix, de modo que wayle usa exactamente el mismo tema
# catppuccin mocha que el resto del escritorio (Hyprland, kitty, apps
# GTK) y ambos cambian a la vez si se cambia el esquema base16.
#
# Definirla aqui daria conflicto de definicion con ese modulo.
[styling]
theme-provider = "wayle"
scale = 0.9
rounding = "sm"

# ─── CPU ───────────────────────────────────────────────────────────────
[modules.cpu]
# El modulo nativo de CPU muestra el porcentaje TOTAL de los 8 hilos.
# Para el detalle por nucleo esta el modulo custom "cpu-cores" de mas
# abajo, que se apoya en el script cpu-cores.sh.
poll-interval-ms = 2000
format = "{{ percent }}%"
icon-name = "computer-symbolic"
icon-show = false
label-show = true
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# Thresholds de color: solo tintan la ETIQUETA cuando la carga es alta
# (el icono se queda blanco, como en HyprPanel). HyprPanel no podia
# hacer esto: solo mostraba el numero sin color segun la carga.
[[modules.cpu.thresholds]]
above = 60
label-color = "status-warning"

[[modules.cpu.thresholds]]
above = 85
label-color = "status-error"

# ─── RAM ───────────────────────────────────────────────────────────────
[modules.ram]
poll-interval-ms = 2000
# Se muestra el porcentaje y, en el tooltip, el detalle de swap. Con el
# zram al 100% el swap ya no se llena por la次回ion, asi que el
# porcentaje de RAM es el dato real de presion de memoria.
format = "{{ percent }}%"
icon-name = "drive-harddisk-symbolic"
icon-show = false
label-show = true
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

[[modules.ram.thresholds]]
above = 80
label-color = "status-warning"

[[modules.ram.thresholds]]
above = 93
label-color = "status-error"

# ─── Volumen ───────────────────────────────────────────────────────────
# Los iconos son los symbolic de Adwaita, no los "ld-*" de Lucide que
# usaba wayle por defecto. Razon: los SVG de Lucide vienen con
# width/height fijos y SIN viewBox, y GTK4 necesita el viewBox para
# escalarlos a otro tamano. Con Adwaita (que si lo tiene) los iconos se
# dibujan nitidos a cualquier escala.
[modules.volume]
icon-name = "audio-volume-high-symbolic"
icon-show = true
label-show = false
format = "{{ percent }}%"
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Red ───────────────────────────────────────────────────────────────
[modules.network]
icon-name = "network-wireless-symbolic"
icon-show = true
label-show = false
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Bluetooth ─────────────────────────────────────────────────────────
[modules.bluetooth]
icon-name = "bluetooth-symbolic"
icon-show = true
label-show = false
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Notificaciones ────────────────────────────────────────────────────
[modules.notifications]
icon-name = "mail-unread-symbolic"
icon-unread = "mail-unread-symbolic"
icon-dnd = "mail-unread-symbolic"
icon-show = true
# Sin el numero de notificaciones al lado del icono: solo la campana.
# label-show = false lo esconde; el contador sigue visible en el menu
# de notificaciones (el dropdown), que es donde se consulta.
label-show = false
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
label-color = "#b4befe"
popup-position = "top-right"
popup-duration = 5000
button-bg-color = "#00000000"

# ─── Reloj ─────────────────────────────────────────────────────────────
[modules.clock]
format = "%H:%M"
icon-name = "preferences-system-time-symbolic"
icon-show = false
label-show = true
label-color = "#b4befe"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Power ─────────────────────────────────────────────────────────────
[modules.power]
icon-name = "system-shutdown-symbolic"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Workspaces de Hyprland ────────────────────────────────────────────
[modules.hyprland-workspaces]
min-workspace-count = 1
monitor-specific = false
show-special = true
urgent-show = true
display-mode = "label"
label-use-name = false
numbering = "absolute"
divider = " "

# Iconos de las aplicaciones abiertas en cada workspace: se ve de un
# vistazo que hay en cada uno. Con app-icons-dedupe se muestra una sola
# vez por aplicacion aunque tenga varias ventanas.
app-icons-show = true
app-icons-dedupe = true
app-icons-empty = "tb-minus-symbolic"
icon-gap = 0.3
workspace-padding = 0.5
icon-color = "#cdd6f4"
label-color = "#cdd6f4"

# ─── Titulo de ventana ─────────────────────────────────────────────────
[modules.window-title]
format = "{{ title }}"
icon-name = "focus-windows-symbolic"
icon-show = false
label-show = true
label-max-length = 60
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Separador ─────────────────────────────────────────────────────────
[modules.separator]
size = 1
length = 1.5
color = "#585b70"

# ─── CPU por nucleo ────────────────────────────────────────────────────
# Modulo custom que ejecuta cpu-cores.sh, que lee /proc/stat y devuelve
# el uso de cada uno de los 8 hilos (4 nucleos fisicos con SMT).
#
# Es la forma de ver el detalle por core que HyprPanel no podia dar: su
# modulo de CPU era un placeholder que solo leia el agregado de
# /proc/stat.
[[modules.custom]]
id = "cpu-cores"
command = "$HOME/.config/wayle/cpu-cores.sh"
mode = "poll"
interval-ms = 2000
format = "{{ output }}"
tooltip-format = "Nucleos fisicos 0-3 (pares = hilos SMT del mismo nucleo)\n{{ output }}"
label-show = true
label-max-length = 40
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"
