########################################################################
# Wayle - sustituto de HyprPanel (archivado en nixpkgs).
#
# Layout actual (simplificado respecto al de HyprPanel):
#   left   : dashboard, separator, window-title
#   center : hyprland-workspaces
#   right  : volume, network, bluetooth, notifications, clock
#
# CPU y RAM se han quitado de la barra: el dropdown del boton de
# dashboard muestra las estadisticas del sistema, asi que en la barra
# eran redundantes. La red y el bluetooth se quedan, que se consulta
# a menudo.
#
# El boton de dashboard sustituye al de power de HyprPanel: el modulo
# "power" de wayle solo trae el icono y su click no hace nada, mientras
# que el dashboard trae un menu nativo con apagar, reiniciar, cerrar
# sesion y bloquear.
#
# Wayle esta escrito en Rust con GTK4: consume mucha menos RAM que
# HyprPanel (que era GTK/JS con un motor web entero por debajo).

# ─── Barra ─────────────────────────────────────────────────────────────
[bar]
location = "top"

# Barra mas baja que la de HyprPanel: 45px frente a los ~53px del
# default (padding = 0.35).
#
# El padding tiene un minimo util de ~0.14: por debajo, la barra queda
# mas baja que el alto que necesitan los iconos y GTK4 los deforma
# (el sintoma es el mismo de antes: iconos estirados en vertical).
# Con los iconos de las apps en los workspaces, que ocupan mas alto,
# el minimo esta algo mas arriba que sin ellos.
#
#
# IMPORTANTE - por que los sizes van a 1.0:
#
# Wayle escala la fila de botones como un todo cuando button-label-size
# (o button-icon-size) lleva un valor FRACCIONARIO. GTK4 no re-renderiza
# los SVG: reescala el pixmap ya rasterizado, y un pixmap estirado en
# vertical deja los iconos deformados (el altavoz parece una flecha y
# el bluetooth una raya).
#
# Se perdio tiempo buscando la causa en el SVG (los iconos de Lucide
# vienen sin viewBox, que tambien deforman) y en el button-variant,
# pero el culpable era el label-size fraccionario: con
# button-label-size = 1.0 los iconos se ven perfectos a cualquier
# altura de barra.
#
# Conclusion: la barra se achica con "padding" (que solo cambia el
# grosor), nunca comprimiendo los iconos o el texto.
scale = 1.0
padding = 0.12
padding-ends = 0.4
module-gap = 0.8
exclusive = true
layer = "top"

# Transparente: en HyprPanel era "theme.bar.transparent = true", con el
# fondo de la barra a rgba(0,0,0,0). Aqui background-opacity = 0 deja
# la barra sin fondo, dejando ver el wallpaper.
background-opacity = 0
rounding = "none"
shadow = "none"

# Botones: sin bordes, sin fondo, texto plano. Es el estilo plano que
# tenia HyprPanel (todo con rgba(0,0,0,0) de fondo).
#
button-variant = "block-prefix"
button-opacity = 100
button-bg-opacity = 0

# Todos los sizes a 1.0 (ver la nota de arriba): bajar cualquiera de
# ellos deforma los iconos. 1.0 son 16px, el tamaño natural del SVG
# symbolic.
button-icon-size = 1.0
button-icon-padding = 1.0
button-label-size = 1.0
button-label-padding = 1.0
button-rounding = "none"
button-gap = 0.4

# Gap DENTRO del grupo de la derecha (los iconos): es el que separa
# los iconos entre si. El group-module-gap (0.25 por defecto) es
# mayor que el module-gap de la barra, asi que sin esto los iconos
# salen mas separados que el resto de la barra.
button-group-module-gap = 0.02

# El grupo tambien tiene su propio fondo (bg-elevated por defecto),
# que es el rectangulo clarito que se veia detras de los iconos de la
# derecha. A transparente, como el resto de la barra.
button-group-background = "#00000000"
button-group-opacity = 0
button-group-border-location = "none"
button-group-border-width = 0
button-group-padding = 0
button-group-rounding = "none"

button-icon-position = "start"
button-border-location = "none"
button-border-width = 0

[bar.colors]
# Fondo totalmente transparente.
bg = "#00000000"

# ─── Layout ────────────────────────────────────────────────────────────
# La barra solo en el DP-1: el HDMI-A-1 (ultrawide 2560x1080) se queda
# sin barra, dejando todo el espacio para las ventanas.
#
# El menu de sesion (apagar, reiniciar, cerrar sesion, bloquear) lo pone
# el modulo "dashboard" de wayle, que es NATIVO: el modulo "power" solo
# trae el icono y su click no hace nada por defecto.
[[bar.layout]]
monitor = "DP-1"
left = [ "dashboard", "separator", "window-title" ]
center = [ "hyprland-workspaces" ]
right = [
    # Los iconos van en un grupo para poder juntarlos entre si
    # (button-group-module-gap) sin que el reloj se pegue a ellos: el
    # reloj va suelto y lo separa el module-gap de la barra.
    { name = "status", modules = [ "volume", "network", "bluetooth", "notifications" ] },
    "clock",
]

# ─── Tema ──────────────────────────────────────────────────────────────
# La paleta NO se define aqui: el modulo wayle/hm.nix de nixpkgs la
# conecta con stylix, de modo que wayle usa exactamente el mismo tema
# catppuccin mocha que el resto del escritorio (Hyprland, kitty, apps
# GTK) y ambos cambian a la vez si se cambia el esquema base16.
#
# Definirla aqui daria conflicto de definicion con ese modulo.
[styling]
theme-provider = "wayle"
# scale a 1.0: con 0.9 (un valor fraccionario) GTK4 reescala los
# pixmap de los iconos y salen deformados, igual que con
# button-label-size. Es la unica escala fraccionaria que quedaba.
scale = 1.0
rounding = "sm"

# ─── Volumen ───────────────────────────────────────────────────────────
# Los iconos son los "ld-*" (Lucide) que trae el propio paquete de
# wayle en share/icons/hicolor/. Es lo que espera wayle: sus SVG
# declaran width/height en 16 y SIN viewBox, asi que GTK4 los dibuja a
# su tamano natural. Usar iconos de otro tema (por ejemplo los symbolic
# de Adwaita) los deforma: GTK4 los reescala el pixmap ya rasterizado
# y salen estirados en vertical.
[modules.volume]
icon-name = "ld-volume-2-symbolic"
icon-show = true
label-show = false
format = "{{ percent }}%"
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Red ───────────────────────────────────────────────────────────────
[modules.network]
icon-name = "ld-wifi-symbolic"
icon-show = true
label-show = false
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Bluetooth ─────────────────────────────────────────────────────────
[modules.bluetooth]
icon-name = "ld-bluetooth-symbolic"
icon-show = true
label-show = false
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Notificaciones ────────────────────────────────────────────────────
[modules.notifications]
icon-name = "ld-bell-symbolic"
icon-unread = "ld-bell-dot-symbolic"
icon-dnd = "ld-bell-off-symbolic"
icon-show = true
# Sin el numero de notificaciones al lado del icono: solo la campana.
# label-show = false lo esconde; el contador sigue visible en el menu
# de notificaciones (el dropdown), que es donde se consulta.
label-show = false
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
label-color = "#b4befe"
popup-position = "top-right"
popup-duration = 5000
button-bg-color = "#00000000"

# ─── Reloj ─────────────────────────────────────────────────────────────
[modules.clock]
format = "%H:%M"
icon-name = "tb-calendar-time-symbolic"
icon-show = false
label-show = true
label-color = "#b4befe"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Power ─────────────────────────────────────────────────────────────
# ─── Dashboard (menu de sesion) ────────────────────────────────────────
# El modulo "dashboard" de wayle trae un dropdown NATIVO con apagar,
# reiniciar, cerrar sesion y bloquear, mas un resumen del sistema y el
# control de audio. Es lo que sustituye al boton de power de HyprPanel.
#
# El boton "power" se deja sin usar: ese modulo solo trae el icono y su
# click no hace nada (ClickAction::None por defecto).
[modules.dashboard]
# El dropdown se abre con el click izquierdo.
left-click = "dropdown:dashboard"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# Comandos del menu de sesion. Los de wayle por defecto son correctos
# salvo el logout: usa $XDG_SESSION_ID, que en una sesion de Hyprland
# iniciada desde getty puede no estar definido. Con loginctl
# terminate-user se cierra la sesion entera, que es lo que se quiere.
dropdown-poweroff-command = "systemctl poweroff"
dropdown-reboot-command = "systemctl reboot"
dropdown-logout-command = "loginctl terminate-user \"$(whoami)\""
dropdown-lock-command = "hyprlock"

# ─── Workspaces de Hyprland ────────────────────────────────────────────
[modules.hyprland-workspaces]
min-workspace-count = 1
monitor-specific = false
show-special = true
urgent-show = true
display-mode = "label"
label-use-name = false
numbering = "absolute"
divider = " "

# Iconos de las aplicaciones abiertas en cada workspace: se ve de un
# vistazo que hay en cada uno. Con app-icons-dedupe se muestra una sola
# vez por aplicacion aunque tenga varias ventanas.
app-icons-show = true
app-icons-dedupe = true
app-icons-empty = "tb-minus-symbolic"
icon-gap = 0.3
workspace-padding = 0.5
icon-color = "#cdd6f4"
label-color = "#cdd6f4"

# ─── Titulo de ventana ─────────────────────────────────────────────────
[modules.window-title]
format = "{{ title }}"
icon-name = "ld-app-window-symbolic"
icon-show = false
label-show = true
label-max-length = 60
label-color = "#cdd6f4"
icon-color = "#cdd6f4"
icon-bg-color = "#00000000"
button-bg-color = "#00000000"

# ─── Separador ─────────────────────────────────────────────────────────
[modules.separator]
size = 1
length = 1.5
color = "#585b70"
